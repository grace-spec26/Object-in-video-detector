      // Update timeline playhead position based on current video time
      function updateTimelinePlayhead() {
        if (!videoElement || videoElement.duration <= 0) return
        const view = getViewRange()
        const pct = ((videoElement.currentTime - view.start) / (view.end - view.start)) * 100
        timelinePlayhead.style.left = pct + '%'
        timelinePlayhead.style.display = 'block'
        renderSceneChart()
      }

      // Analyze scene changes by computing pixel delta between sampled frames
      function getAnalysisInterval(duration) {
        // Target ~1000 samples total, clamped to [0.2, 1] seconds
        const target = duration / 1000
        if (target <= 0.2) return 0.2
        if (target >= 1) return 1
        return target
      }

      function percentile(values, p) {
        if (values.length === 0) return 0
        const sorted = [...values].sort((a, b) => a - b)
        const index = Math.min(sorted.length - 1, Math.max(0, Math.floor((sorted.length - 1) * p)))
        return sorted[index]
      }

      function deltaStats(values) {
        if (values.length < 2) return null
        const median = percentile(values, 0.5)
        const q1 = percentile(values, 0.25)
        const q3 = percentile(values, 0.75)
        const deviations = values.map(delta => Math.abs(delta - median))
        const mad = percentile(deviations, 0.5)
        return {
          median,
          iqr: q3 - q1,
          mad,
        }
      }

      function localDeltaStats(samples, start, end, excludeIndex) {
        const values = []
        for (let i = start; i <= end; i++) {
          if (i === excludeIndex) continue
          const delta = samples[i].delta
          if (Number.isFinite(delta) && delta > 0) values.push(delta)
        }
        return deltaStats(values)
      }

      function detectCameraSwitchTimes(samples, duration, interval) {
        const deltas = samples.map(s => s.delta).filter(delta => delta > 0)
        if (deltas.length < 3) return []

        const median = percentile(deltas, 0.5)
        const q1 = percentile(deltas, 0.25)
        const q3 = percentile(deltas, 0.75)
        const q90 = percentile(deltas, 0.9)
        const deviations = deltas.map(delta => Math.abs(delta - median))
        const mad = percentile(deviations, 0.5)

        // Camera switches are sharp peaks in frame-to-frame visual change.
        // The global threshold catches strong absolute peaks. The local
        // prominence check catches smaller sharp cuts in long/high-motion
        // videos where global statistics can otherwise rise too high.
        const iqr = q3 - q1
        const threshold = Math.max(12, q90, median + mad * 6, q3 + iqr * 1.5)
        const localRadiusSamples = Math.max(3, Math.ceil(6 / Math.max(interval, 0.001)))
        const minGapSeconds = Math.max(1, interval * 2)
        const edgeGapSeconds = Math.max(0.2, interval * 0.5)

        const candidates = []
        for (let i = 1; i < samples.length - 1; i++) {
          const prev = samples[i - 1].delta
          const cur = samples[i].delta
          const next = samples[i + 1].delta
          const time = samples[i].time
          if (time <= edgeGapSeconds || time >= duration - edgeGapSeconds) continue
          if (cur < prev || cur < next) continue

          const globalPeak = cur >= threshold
          const localStart = Math.max(0, i - localRadiusSamples)
          const localEnd = Math.min(samples.length - 1, i + localRadiusSamples)
          const localStatsOptions = [
            localDeltaStats(samples, localStart, localEnd, i),
            localDeltaStats(samples, localStart, Math.max(localStart, i - 1), i),
            localDeltaStats(samples, Math.min(localEnd, i + 1), localEnd, i),
          ].filter(Boolean)
          const localStats = localStatsOptions.sort((a, b) => a.median - b.median)[0]
          const localProminence = localStats
            ? Math.max(8, localStats.mad * 5, localStats.iqr * 1.5)
            : Infinity
          const localPeak = localStats
            ? cur >= Math.max(10, localStats.median + localProminence)
            : false
          if (!globalPeak && !localPeak) continue

          candidates.push({ time, delta: cur })
        }

        candidates.sort((a, b) => b.delta - a.delta)
        const selected = []
        for (const candidate of candidates) {
          if (selected.some(item => Math.abs(item.time - candidate.time) < minGapSeconds)) continue
          selected.push(candidate)
        }

        return selected.map(item => item.time).sort((a, b) => a - b)
      }

      function mergeCameraSwitchCutPoints(switchTimes, duration) {
        if (switchTimes.length === 0) return 0

        if (segmentMode === 'explicit') {
          switchToPointsMode()
        } else {
          readCutPointsFromUI()
        }

        const tolerance = 0.05
        const merged = [0, duration, ...cutPoints]
        let added = 0
        for (const time of switchTimes) {
          const clamped = Math.min(Math.max(time, 0), duration)
          if (clamped <= 0 || clamped >= duration) continue
          if (merged.some(existing => Math.abs(existing - clamped) <= tolerance)) continue
          merged.push(clamped)
          added++
        }

        cutPoints = merged
          .filter(time => Number.isFinite(time) && time >= 0 && time <= duration)
          .sort((a, b) => a - b)
          .filter((time, index, points) => index === 0 || Math.abs(time - points[index - 1]) > tolerance)

        renderSegmentsUI()
        renderTimeline()
        return added
      }

      async function analyzeSceneChanges() {
        if (!videoElement || videoElement.readyState < 2 || videoElement.duration <= 0) return
        if (isAnalyzing) return
        isAnalyzing = true
        sceneDeltas = []
        sceneChartCanvas.width = sceneChartCanvas.width

        // Pause video during analysis to avoid decoder contention
        const wasPlaying = !videoElement.paused
        const savedTime = videoElement.currentTime
        videoElement.pause()

        const duration = videoElement.duration
        const interval = getAnalysisInterval(duration)
        const samples = []
        const offscreen = document.createElement('canvas')
        const w = 80
        const vw = videoElement.videoWidth
        const vh = videoElement.videoHeight
        const h = vw > 0 && vh > 0 ? Math.round(w / (vw / vh)) : 45
        offscreen.width = w
        offscreen.height = h
        const ctx = offscreen.getContext('2d')
        let prevData = null

        analyzeScenesBtn.classList.add('hidden')
        sceneChartLoading.classList.remove('hidden')

        try {
          // Sample the video at regular intervals
          let lastTime = 0
          let lastProgressRender = performance.now()
          let progressRendered = false
          for (let t = 0; t < duration; t += interval) {
            // Yield to let UI update
            if (t - lastTime >= 10) {
              await new Promise(r => setTimeout(r, 0))
              lastTime = t
            }

            if (shouldStopAnalysis) break

            // Only wait for seeked if actually seeking to a different time
            if (videoElement.currentTime !== t) {
              await new Promise(resolve => {
                videoElement.addEventListener('seeked', resolve, { once: true })
                videoElement.currentTime = t
              })
            }
            // Sync with paint cycle to ensure frame is decoded
            await new Promise(r => requestAnimationFrame(r))

            ctx.drawImage(videoElement, 0, 0, w, h)
            const imageData = ctx.getImageData(0, 0, w, h)
            const pixels = imageData.data

            if (prevData) {
              // Compute sum of absolute differences per pixel (average across RGB)
              let totalDiff = 0
              for (let i = 0; i < pixels.length; i += 4) {
                const dr = Math.abs(pixels[i] - prevData[i])
                const dg = Math.abs(pixels[i + 1] - prevData[i + 1])
                const db = Math.abs(pixels[i + 2] - prevData[i + 2])
                totalDiff += (dr + dg + db) / 3
              }
              const avgDiff = totalDiff / (w * h)
              samples.push({ time: t, delta: avgDiff })
            } else {
              samples.push({ time: t, delta: 0 })
            }

            prevData = new Uint8Array(pixels)

            // Progressive render every 2s during long analysis
            if (samples.length >= 2) {
              const now = performance.now()
              if (now - lastProgressRender >= 2000) {
                let curMax = 0
                for (const s of samples) if (s.delta > curMax) curMax = s.delta
                sceneDeltas = samples.map(s => ({
                  time: s.time,
                  delta: curMax > 0 ? s.delta / curMax : 0,
                }))
                if (!progressRendered) {
                  progressRendered = true
                  resetChartView()
                  sceneChartSection.classList.remove('hidden')
                }
                renderSceneChart()
                lastProgressRender = now
              }
            }
          }

          // Restore video position (don't seek to 0 — keep user's place)
          videoElement.currentTime = savedTime

          // Normalize deltas to 0-1 relative to max
          let maxDelta = 0
          for (const s of samples) {
            if (s.delta > maxDelta) maxDelta = s.delta
          }
          sceneDeltas = samples.map(s => ({
            time: s.time,
            delta: maxDelta > 0 ? s.delta / maxDelta : 0,
          }))
          const switchTimes = detectCameraSwitchTimes(samples, duration, interval)
          const addedSwitches = mergeCameraSwitchCutPoints(switchTimes, duration)
          if (switchTimes.length > 0) {
            console.info(`Detected ${switchTimes.length} camera switch(es); added ${addedSwitches} new cut point(s).`)
          } else {
            console.info('No camera switches detected.')
          }
          resetChartView()
        } catch (e) {
          console.warn('Scene analysis failed:', e)
          videoElement.currentTime = savedTime
        }

        sceneChartLoading.classList.add('hidden')
        analyzeScenesBtn.disabled = false
        analyzeScenesBtn.textContent = '📊 Detect Camera Switches'
        if (sceneDeltas.length > 0) {
          renderTimeline()
        } else {
          analyzeScenesBtn.classList.remove('hidden')
        }
        shouldStopAnalysis = false
        isAnalyzing = false
        // Resume playback if it was playing before analysis
        if (wasPlaying) videoElement.play()
      }

      function getViewRange() {
        const duration = videoElement ? videoElement.duration : 0
        if (chartView.end > 0 && duration > 0) {
          return { start: chartView.start, end: chartView.end }
        }
        return { start: 0, end: duration }
      }

      function renderSceneChart() {
        if (sceneDeltas.length === 0) return
        if (sceneChartSection.classList.contains('hidden')) return
        const canvas = sceneChartCanvas
        const rect = canvas.parentElement.getBoundingClientRect()
        const w = rect.width
        const h = canvas.height
        canvas.width = w * devicePixelRatio
        canvas.height = h * devicePixelRatio
        const ctx = canvas.getContext('2d')
        ctx.scale(devicePixelRatio, devicePixelRatio)

        // Clear
        ctx.clearRect(0, 0, w, h)

        const padding = 2
        const chartTop = padding
        const chartBottom = h - padding
        const chartHeight = chartBottom - chartTop

        if (sceneDeltas.length < 2) return

        const view = getViewRange()
        const viewDuration = view.end - view.start
        if (viewDuration <= 0) return
        const xScale = w / viewDuration

        // Draw filled area (only visible samples)
        ctx.beginPath()
        ctx.moveTo(0, chartBottom)
        for (const s of sceneDeltas) {
          if (s.time < view.start) continue
          if (s.time > view.end) break
          const x = (s.time - view.start) * xScale
          const y = chartBottom - s.delta * chartHeight
          ctx.lineTo(x, y)
        }
        ctx.lineTo(w, chartBottom)
        ctx.closePath()
        ctx.fillStyle = 'rgba(102, 126, 234, 0.15)'
        ctx.fill()

        // Draw line
        ctx.beginPath()
        let first = true
        for (const s of sceneDeltas) {
          if (s.time < view.start) continue
          if (s.time > view.end) break
          const x = (s.time - view.start) * xScale
          const y = chartBottom - s.delta * chartHeight
          if (first) { ctx.moveTo(x, y); first = false }
          else ctx.lineTo(x, y)
        }
        ctx.strokeStyle = '#667eea'
        ctx.lineWidth = 1
        ctx.stroke()

        // Draw segment boundaries as vertical lines
        const segs = getSegments()
        for (const seg of segs) {
          if (seg.end < view.start || seg.start > view.end) continue
          const x1 = Math.max(0, (Math.max(seg.start, view.start) - view.start) * xScale)
          const x2 = Math.min(w, (Math.min(seg.end, view.end) - view.start) * xScale)
          ctx.strokeStyle = 'rgba(0,0,0,0.3)'
          ctx.lineWidth = 1
          ctx.setLineDash([3, 3])
          ctx.beginPath()
          ctx.moveTo(x1, chartTop)
          ctx.lineTo(x1, chartBottom)
          ctx.stroke()
          ctx.beginPath()
          ctx.moveTo(x2, chartTop)
          ctx.lineTo(x2, chartBottom)
          ctx.stroke()
          ctx.setLineDash([])
        }

        // Draw playhead
        if (videoElement && videoElement.duration > 0) {
          const playheadX = (videoElement.currentTime - view.start) * xScale
          if (playheadX >= 0 && playheadX <= w) {
            ctx.strokeStyle = '#ff4444'
            ctx.lineWidth = 2
            ctx.setLineDash([])
            ctx.beginPath()
            ctx.moveTo(playheadX, chartTop)
            ctx.lineTo(playheadX, chartBottom)
            ctx.stroke()
          }
        }
      }

      function resetChartView() {
        const duration = videoElement ? videoElement.duration : 0
        if (duration > 0) {
          chartView = { start: 0, end: duration }
        } else {
          chartView = { start: 0, end: 0 }
        }
      }

      // Render colored segment blocks on the timeline bar
      function renderTimeline() {
        // Hide timeline if video is not loaded
        if (!videoElement || videoElement.readyState < 1) {
          timelineSection.classList.add('hidden')
          sceneChartSection.classList.add('hidden')
          timelinePlayhead.style.display = 'none'
          return
        }

        const duration = videoElement.duration
        if (duration <= 0) {
          timelineSection.classList.add('hidden')
          sceneChartSection.classList.add('hidden')
          timelinePlayhead.style.display = 'none'
          return
        }

        const segs = getSegments()
        if (segs.length === 0) {
          timelineSection.classList.add('hidden')
          sceneChartSection.classList.add('hidden')
          timelinePlayhead.style.display = 'none'
          return
        }

        timelineSection.classList.remove('hidden')
        sceneChartSection.classList.remove('hidden')
        timelinePlayhead.style.display = 'block'
        timelineSegments.innerHTML = ''

        const view = getViewRange()
        const viewDuration = view.end - view.start

        timelineStartLabel.textContent = formatTime(view.start)
        timelineEndLabel.textContent = formatTime(view.end)

        segs.forEach((seg, index) => {
          const segStart = Math.max(seg.start, view.start)
          const segEnd = Math.min(seg.end, view.end)
          if (segEnd <= segStart) return

          const leftPercent = ((segStart - view.start) / viewDuration) * 100
          const widthPercent = ((segEnd - segStart) / viewDuration) * 100
          const color = getSegmentColor(index)

          const el = document.createElement('div')
          el.className = 'timeline-segment'
          el.style.left = leftPercent + '%'
          el.style.width = widthPercent + '%'
          el.style.background = color.fill
          el.style.borderColor = color.border

          el.title = `Segment ${index + 1}: ${formatTime(seg.start)} - ${formatTime(seg.end)}`

          const label = document.createElement('span')
          label.className = 'timeline-segment-label'
          label.textContent = index + 1
          el.appendChild(label)

          el.addEventListener('click', e => {
            e.stopPropagation()
            if (videoElement) {
              videoElement.currentTime = seg.start
              videoElement.play()
              const handler = () => {
                if (videoElement.currentTime >= seg.end) {
                  videoElement.pause()
                  videoElement.removeEventListener('timeupdate', handler)
                }
              }
              videoElement.addEventListener('timeupdate', handler)
            }
          })

          timelineSegments.appendChild(el)
        })

        renderSceneChart()
      }

      // Initialize with a single default segment covering the full video
      function initSegmentsForVideo() {
        const duration = videoElement.duration
        // Set cut points from start to end
        cutPoints = [0, duration]
        // Set explicit segment covering full duration
        explicitSegments = [{
          id: ++segmentIdCounter,
          start: 0,
          end: duration,
        }]
        renderSegmentsUI()
        renderTimeline()
      }

      // Export segments as a downloadable JSON file
      function exportSegments() {
        readCutPointsFromUI()
        readExplicitSegmentsFromUI()
        const data = {
          version: 1,
          segmentMode: segmentMode,
        }
        if (segmentMode === 'points') {
          data.cutPoints = cutPoints
          data.explicitSegments = []
        } else {
          data.cutPoints = []
          data.explicitSegments = explicitSegments.map(s => ({ start: s.start, end: s.end }))
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = videoFileName ? `${videoFileName}_segments.json` : 'segments.json'
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        URL.revokeObjectURL(url)
      }

      function sanitizeOutputVideoName(name) {
        const cleaned = String(name || '')
          .trim()
          .replace(/[/\\?%*:|"<>]/g, '_')
          .replace(/\s+/g, '_')
          .replace(/^_+|_+$/g, '')
        return cleaned || videoFileName || 'segment'
      }

      function getSupportedMp4MimeType() {
        if (!window.MediaRecorder) return null
        const mimeTypes = [
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=h264,aac',
          'video/mp4;codecs=avc1',
          'video/mp4',
        ]
        return mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || null
      }

      function getVideoCaptureStream() {
        if (videoElement.captureStream) return videoElement.captureStream()
        if (videoElement.mozCaptureStream) return videoElement.mozCaptureStream()
        if (videoElement.webkitCaptureStream) return videoElement.webkitCaptureStream()
        return null
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = filename
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        setTimeout(() => URL.revokeObjectURL(url), 1000)
      }

      function seekVideoTo(time) {
        return new Promise((resolve, reject) => {
          if (!videoElement) {
            reject(new Error('No video is loaded'))
            return
          }

          const onSeeked = () => {
            cleanup()
            resolve()
          }
          const onError = () => {
            cleanup()
            reject(new Error('Could not seek video'))
          }
          const cleanup = () => {
            videoElement.removeEventListener('seeked', onSeeked)
            videoElement.removeEventListener('error', onError)
          }

          if (Math.abs(videoElement.currentTime - time) < 0.025 && videoElement.readyState >= 2) {
            resolve()
            return
          }

          videoElement.addEventListener('seeked', onSeeked, { once: true })
          videoElement.addEventListener('error', onError, { once: true })
          videoElement.currentTime = time
        })
      }

      function waitForSegmentEnd(start, end, segmentIndex, segmentCount) {
        return new Promise(resolve => {
          const segmentDuration = Math.max(end - start, 0.001)
          let done = false
          const finish = () => {
            if (done) return
            done = true
            clearTimeout(timeout)
            resolve()
          }
          const timeout = setTimeout(finish, (segmentDuration + 2) * 1000)

          const tick = () => {
            if (done) return
            const current = Math.min(Math.max(videoElement.currentTime, start), end)
            const segmentProgress = (current - start) / segmentDuration
            const progressPercent = ((segmentIndex + segmentProgress) / segmentCount) * 100
            progressFill.style.width = `${Math.min(100, progressPercent)}%`
            progressFill.textContent = `${segmentIndex + 1}/${segmentCount}`

            if (videoElement.currentTime >= end || videoElement.ended) {
              finish()
              return
            }
            requestAnimationFrame(tick)
          }

          tick()
        })
      }

      async function recordSegmentAsMp4(segment, mimeType, segmentIndex, segmentCount) {
        const duration = videoElement.duration
        const start = Math.max(0, Math.min(segment.start, duration))
        const end = Math.max(start, Math.min(segment.end, duration))
        if (end <= start) {
          throw new Error(`Segment ${segmentIndex + 1} has an invalid time range`)
        }

        await seekVideoTo(start)
        await new Promise(resolve => requestAnimationFrame(resolve))

        const stream = getVideoCaptureStream()
        if (!stream || stream.getTracks().length === 0) {
          throw new Error('This browser cannot capture the loaded video stream')
        }

        const chunks = []
        const recorder = new MediaRecorder(stream, { mimeType })
        const recordingDone = new Promise((resolve, reject) => {
          recorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) chunks.push(event.data)
          }
          recorder.onerror = event => {
            reject(event.error || new Error('Segment recording failed'))
          }
          recorder.onstop = () => {
            resolve(new Blob(chunks, { type: mimeType }))
          }
        })

        try {
          recorder.start(250)
          await videoElement.play()
          await waitForSegmentEnd(start, end, segmentIndex, segmentCount)
          videoElement.pause()
          if (recorder.state !== 'inactive') recorder.stop()
          return await recordingDone
        } finally {
          if (recorder.state !== 'inactive') recorder.stop()
          stream.getTracks().forEach(track => track.stop())
        }
      }

      function getValidatedSegmentsForVideoExport() {
        readCutPointsFromUI()
        readExplicitSegmentsFromUI()
        const duration = videoElement.duration
        const segments = getSegments()
          .map(seg => ({
            start: Math.max(0, Math.min(seg.start, duration)),
            end: Math.max(0, Math.min(seg.end, duration)),
          }))
          .filter(seg => seg.end > seg.start)

        if (segments.length === 0) {
          throw new Error('No valid segments defined. Add at least one segment.')
        }
        return segments
      }

      async function exportSegmentVideos() {
        if (isExportingSegmentVideos) return
        if (!videoFile || !videoElement || videoElement.readyState < 2) {
          showError('Please select a loaded video file first')
          return
        }

        const mimeType = getSupportedMp4MimeType()
        if (!mimeType) {
          showError('This browser cannot export MP4 segments with MediaRecorder. Try a browser with video/mp4 MediaRecorder support.')
          return
        }

        let segments
        try {
          segments = getValidatedSegmentsForVideoExport()
        } catch (error) {
          showError(error.message)
          return
        }

        const outputName = sanitizeOutputVideoName(segmentVideoNameInput.value)
        const savedTime = videoElement.currentTime
        const savedPlaybackRate = videoElement.playbackRate
        const wasPlaying = !videoElement.paused

        isExportingSegmentVideos = true
        exportSegmentVideosBtn.disabled = true
        exportSegmentVideosBtn.textContent = 'Exporting...'
        extractBtn.disabled = true
        progress.classList.add('active')
        progressFill.style.width = '0%'
        progressFill.textContent = '0%'
        errorDiv.classList.add('hidden')

        try {
          videoElement.pause()
          videoElement.playbackRate = 1
          for (let i = 0; i < segments.length; i++) {
            progressFill.textContent = `${i + 1}/${segments.length}`
            const blob = await recordSegmentAsMp4(segments[i], mimeType, i, segments.length)
            if (!blob || blob.size === 0) {
              throw new Error(`Segment ${i + 1} exported an empty video`)
            }
            downloadBlob(blob, `${outputName}_${i + 1}.mp4`)
            await new Promise(resolve => setTimeout(resolve, 250))
          }
          progressFill.style.width = '100%'
          progressFill.textContent = 'Done'
        } catch (error) {
          showError('Error exporting MP4 segments: ' + error.message)
        } finally {
          videoElement.pause()
          videoElement.playbackRate = savedPlaybackRate
          await seekVideoTo(Math.min(savedTime, videoElement.duration)).catch(() => {})
          if (wasPlaying) await videoElement.play().catch(() => {})
          exportSegmentVideosBtn.disabled = false
          exportSegmentVideosBtn.textContent = 'Export MP4 Segments'
          extractBtn.disabled = false
          isExportingSegmentVideos = false
          setTimeout(() => {
            if (!isExportingSegmentVideos) progress.classList.remove('active')
          }, 700)
        }
      }

      // Import segments from a JSON file
      function importSegments(file) {
        const reader = new FileReader()
        reader.onload = e => {
          try {
            const data = JSON.parse(e.target.result)
            if (!data.version || !data.segmentMode) {
              showError('Invalid segment file format')
              return
            }
            segmentMode = data.segmentMode
            cutPoints = data.cutPoints || []
            explicitSegments = (data.explicitSegments || []).map(s => ({
              id: ++segmentIdCounter,
              start: s.start,
              end: s.end,
            }))
            // Sync mode toggle UI
            document.querySelectorAll('.segment-mode-toggle label').forEach(l => l.classList.remove('active'))
            const label = document.querySelector(`.segment-mode-toggle label[data-mode="${segmentMode}"]`)
            if (label) {
              label.classList.add('active')
              label.querySelector('input').checked = true
            }
            renderSegmentsUI()
            renderTimeline()
          } catch (err) {
            showError('Error importing segments: ' + err.message)
          }
        }
        reader.readAsText(file)
      }

      function setupVideoUI() {
        // Reset scene chart for new video
        sceneDeltas = []
        isAnalyzing = false
        shouldStopAnalysis = false
        chartView = { start: 0, end: 0 }
        sceneChartLoading.classList.add('hidden')
        analyzeScenesBtn.disabled = false
        analyzeScenesBtn.textContent = '📊 Detect Camera Switches'
        analyzeScenesBtn.classList.remove('hidden')
        sceneChartCanvas.width = sceneChartCanvas.width

        videoPreview.classList.remove('hidden')
        snapshotSection.classList.remove('hidden')
        controls.classList.remove('hidden')
        document.querySelector('.control-buttons')?.classList.remove('hidden')
        extractBtn.disabled = false
        exportSegmentVideosBtn.disabled = false
        exportSegmentVideosBtn.textContent = 'Export MP4 Segments'
        segmentVideoNameInput.value = videoFileName || 'segment'
        errorDiv.classList.add('hidden')

        // Update label to match current mode (handles Firefox stored values)
        updateValueLabel()

        // Initialize segments when video metadata loads
        video.addEventListener(
          'loadedmetadata',
          () => {
            initSegmentsForVideo()
          },
          { once: true },
        )

        // Update timeline playhead on playback
        video.removeEventListener('timeupdate', updateTimelinePlayhead)
        video.addEventListener('timeupdate', updateTimelinePlayhead)

        // Reset previous extraction
        extractedFrames = []
        updateFrameCount()
        previewSection.classList.add('hidden')
        downloadBtn.disabled = true
      }

      function handleVideoFile(file) {
        videoFile = file
        // Store original filename without extension
        const fileName = file.name
        const lastDot = fileName.lastIndexOf('.')
        videoFileName = lastDot > 0 ? fileName.substring(0, lastDot) : fileName
        // Sanitize filename (remove special characters, keep only alphanumeric, dash, underscore)
        videoFileName = videoFileName.replace(/[/\\?%*:|"<>]/g, '_')

        const url = URL.createObjectURL(file)
        video.src = url
        videoElement = video
        setupVideoUI()
      }

      async function triggerCapture() {
        if (!videoElement || videoElement.readyState < 2) {
          showError('Please wait for the video to load')
          return
        }

        try {
          await captureCurrentFrame()
        } catch (error) {
          showError('Error capturing frame: ' + error.message)
        }
      }

      snapshotBtn.addEventListener('click', triggerCapture)

      // Keyboard shortcuts: C=capture, A=add segment/point, S=set start, E=set end
      // Note: Left/Right arrows and Spacebar work by default for video controls
      document.addEventListener('keydown', async e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return

        // Capture current frame
        if (
          (e.key === 'c' || e.key === 'C') &&
          !snapshotSection.classList.contains('hidden')
        ) {
          e.preventDefault()
          await triggerCapture()
          return
        }

        // Segment shortcuts (only when controls section is visible)
        if (!controls.classList.contains('hidden')) {
          if (segmentMode === 'points') {
            if (e.key === 'a' || e.key === 'A') {
              e.preventDefault()
              addCutPoint()
              return
            }
            if (e.key === 's' || e.key === 'S') {
              e.preventDefault()
              setCutPointStart()
              return
            }
            if (e.key === 'e' || e.key === 'E') {
              e.preventDefault()
              setCutPointEnd()
              return
            }
          }
          if (segmentMode === 'explicit') {
            if (e.key === 'a' || e.key === 'A') {
              e.preventDefault()
              addExplicitSegment()
              return
            }
            if (e.key === 's' || e.key === 'S') {
              e.preventDefault()
              setExplicitStart()
              return
            }
            if (e.key === 'e' || e.key === 'E') {
              e.preventDefault()
              setExplicitEnd()
              return
            }
          }
        }

        // Don't prevent default for ArrowLeft, ArrowRight, or Space - let browser handle them
      })

      function createPreviewItem(frame, frameIndex) {
        const img = document.createElement('img')
        img.src = URL.createObjectURL(frame.blob)
        img.alt = `Frame ${frameIndex}`

        const previewItem = document.createElement('div')
        previewItem.className = 'preview-item'
        previewItem.dataset.frameId = frame.id
        previewItem.dataset.frameIndex = frameIndex
        previewItem.appendChild(img)

        // Delete button
        const deleteBtn = document.createElement('button')
        deleteBtn.className = 'delete-btn'
        deleteBtn.type = 'button' // Prevent form submission
        deleteBtn.innerHTML = '×'
        deleteBtn.title = 'Remove this frame'
        deleteBtn.addEventListener('click', e => {
          e.preventDefault()
          e.stopPropagation()
          removeFrame(frame.id)
        })
        previewItem.appendChild(deleteBtn)

        // Frame number label
        const frameNumber = document.createElement('div')
        frameNumber.className = 'frame-number'
        const manualLabel = frame.isManual ? ' - Manual' : ''
        const segIndexDisplay = frame.segmentIndex !== undefined ? frame.segmentIndex + 1 : null
        const segLabel = segIndexDisplay ? ` Seg${segIndexDisplay}` : ''
        const timeStr = formatTime(frame.time)
        const timeSpan = document.createElement('span')
        timeSpan.textContent = timeStr
        frameNumber.appendChild(document.createTextNode(`Frame ${frameIndex} (`))
        frameNumber.appendChild(timeSpan)
        frameNumber.appendChild(document.createTextNode(`)${segLabel}${manualLabel}`))
        frameNumber.title = 'Click to copy timestamp'
        frameNumber.addEventListener('click', () => {
          navigator.clipboard.writeText(timeStr).catch(() => {})
          const range = document.createRange()
          range.selectNodeContents(timeSpan)
          window.getSelection().removeAllRanges()
          window.getSelection().addRange(range)
          timeSpan.style.transition = 'background 0.2s'
          timeSpan.style.background = 'rgba(102, 126, 234, 0.8)'
          setTimeout(() => { timeSpan.style.background = '' }, 300)
        })
        previewItem.appendChild(frameNumber)

        return previewItem
      }

      function updateFrameCount() {
        frameCount.textContent = extractedFrames.length
        // Show/hide remove all button based on frame count
        if (extractedFrames.length > 0) {
          removeAllBtn.classList.remove('hidden')
          removeAllBtn.disabled = false
        } else {
          removeAllBtn.classList.add('hidden')
          removeAllBtn.disabled = true
        }
      }

      function removeFrame(frameId) {
        // Remove from DOM first to revoke object URL
        const previewItem = previewGrid.querySelector(
          `[data-frame-id="${frameId}"]`,
        )
        if (previewItem) {
          const img = previewItem.querySelector('img')
          if (img && img.src) {
            URL.revokeObjectURL(img.src)
          }
          // Smooth removal with fade out
          previewItem.style.transition = 'opacity 0.1s, transform 0.1s'
          previewItem.style.opacity = '0'
          previewItem.style.transform = 'scale(0.9)'
          setTimeout(() => {
            previewItem.remove()
          }, 100)
        }

        // Remove from array using unique ID
        extractedFrames = extractedFrames.filter(f => f.id !== frameId)

        // Update indices of remaining frames without full rebuild
        updateFrameIndices()
        updateFrameCount()

        // Disable download if no frames left
        if (extractedFrames.length === 0) {
          downloadBtn.disabled = true
          previewSection.classList.add('hidden')
        }
      }

      function updateFrameIndices() {
        // Update indices in array and DOM without full rebuild
        // Since frames are displayed newest first, we need to update in reverse order
        const reversedFrames = [...extractedFrames].reverse()
        reversedFrames.forEach((frame, idx) => {
          const newIndex = extractedFrames.length - idx
          const oldIndex = frame.index
          frame.index = newIndex

          // Update DOM element if it exists using unique ID
          const previewItem = previewGrid.querySelector(
            `[data-frame-id="${frame.id}"]`,
          )
          if (previewItem) {
            previewItem.dataset.frameIndex = newIndex
            const frameNumber = previewItem.querySelector('.frame-number')
            if (frameNumber) {
              const manualLabel = frame.isManual ? ' - Manual' : ''
              const segIndexDisplay2 = frame.segmentIndex !== undefined ? frame.segmentIndex + 1 : null
              const segLabel2 = segIndexDisplay2 ? ` Seg${segIndexDisplay2}` : ''
              frameNumber.textContent = `Frame ${newIndex} (${formatTime(frame.time)})${segLabel2}${manualLabel}`
            }
          }
        })
      }

      function rebuildPreviewGrid() {
        // Clear and rebuild preview grid with updated indices (newest first)
        previewGrid.innerHTML = ''
        // Reverse array to show newest first
        const reversedFrames = [...extractedFrames].reverse()
        reversedFrames.forEach((frame, idx) => {
          const newIndex = extractedFrames.length - idx
          frame.index = newIndex
          const previewItem = createPreviewItem(frame, newIndex)
          previewGrid.appendChild(previewItem)
        })
      }

      async function captureCurrentFrame() {
        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')

        canvas.width = videoElement.videoWidth
        canvas.height = videoElement.videoHeight

        // Draw current frame to canvas
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height)

        // Convert to blob
        const blob = await new Promise(resolve => {
          canvas.toBlob(resolve, 'image/jpeg', 0.9)
        })

        const currentTime = videoElement.currentTime
        const frameIndex = extractedFrames.length + 1

        const frame = {
          id: ++frameIdCounter,
          blob: blob,
          time: currentTime,
          index: frameIndex,
          isManual: true,
        }

        extractedFrames.push(frame)

        // Show preview (newest first)
        const previewItem = createPreviewItem(frame, frameIndex)
        previewGrid.insertBefore(previewItem, previewGrid.firstChild)

        // Update frame count
        updateFrameCount()

        // Show preview section and enable download
        previewSection.classList.remove('hidden')
        downloadBtn.disabled = false
      }

      function showError(message) {
        errorDiv.textContent = message
        errorDiv.classList.remove('hidden')
      }

      extractBtn.addEventListener('click', async () => {
        if (!videoFile || !videoElement) {
          showError('Please select a video file first')
          return
        }

        extractBtn.disabled = true
        stopBtn.classList.remove('hidden')
        stopBtn.disabled = false
        stopBtn.textContent = '⏹ Stop Extraction'
        progress.classList.add('active')
        errorDiv.classList.add('hidden')
        shouldStopExtraction = false

        // Preserve manually captured frames
        const manualFrames = extractedFrames.filter(f => f.isManual)
        const manualCount = manualFrames.length

        // Clear preview grid but keep manual frames
        previewGrid.innerHTML = ''

        // Re-add manual frames to preview (newest first)
        const reversedManualFrames = [...manualFrames].reverse()
        for (let i = 0; i < reversedManualFrames.length; i++) {
          const frame = reversedManualFrames[i]
          const previewItem = createPreviewItem(frame, frame.index)
          previewGrid.appendChild(previewItem)
        }

        // Clear automatic frames but keep manual ones
        extractedFrames = manualFrames

        const mode = extractMode.value
        const value = parseFloat(extractValue.value)

        if (mode === 'interval' && value <= 0) {
          showError('Interval must be greater than 0')
          extractBtn.disabled = false
          stopBtn.classList.add('hidden')
          progress.classList.remove('active')
          return
        }

        if (mode === 'count' && value < 1) {
          showError('Total count must be at least 1')
          extractBtn.disabled = false
          stopBtn.classList.add('hidden')
          progress.classList.remove('active')
          return
        }

        // Read current segment data from UI
        readCutPointsFromUI()
        readExplicitSegmentsFromUI()
        const segs = getSegments()

        if (segs.length === 0) {
          showError('No segments defined. Add at least one segment.')
          extractBtn.disabled = false
          stopBtn.classList.add('hidden')
          progress.classList.remove('active')
          return
        }

        // Validate segments
        for (const seg of segs) {
          if (seg.start < 0) {
            showError('Start time cannot be negative')
            extractBtn.disabled = false
            stopBtn.classList.add('hidden')
            progress.classList.remove('active')
            return
          }
          if (seg.end <= seg.start) {
            showError('End time must be greater than start time in each segment')
            extractBtn.disabled = false
            stopBtn.classList.add('hidden')
            progress.classList.remove('active')
            return
          }
        }

        try {
          await extractFrames(mode, value, segs)
        } catch (error) {
          showError('Error extracting frames: ' + error.message)
          extractBtn.disabled = false
          stopBtn.classList.add('hidden')
          progress.classList.remove('active')
          shouldStopExtraction = false
        }
      })

      stopBtn.addEventListener('click', () => {
        shouldStopExtraction = true
        stopBtn.disabled = true
        stopBtn.textContent = '⏹ Stopping...'
      })

      async function extractFrames(mode, value, segments) {
        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')

        // Wait for video metadata to load
        await new Promise(resolve => {
          if (videoElement.readyState >= 2) {
            resolve()
          } else {
            videoElement.addEventListener('loadedmetadata', resolve, {
              once: true,
            })
          }
        })

        const duration = videoElement.duration
        canvas.width = videoElement.videoWidth
        canvas.height = videoElement.videoHeight

        // Generate frame times for all segments
        let frameSamples = [] // { time, segmentIndex }[]

        for (let segIdx = 0; segIdx < segments.length; segIdx++) {
          const seg = segments[segIdx]
          const segStart = Math.max(0, Math.min(seg.start, duration))
          const segEnd = seg.end > 0 ? Math.min(seg.end, duration) : duration

          if (segEnd <= segStart) continue

          const rangeDuration = segEnd - segStart
          const segTimes = []

          if (mode === 'interval') {
            // Extract by interval within the time range
            for (let time = segStart; time < segEnd; time += value) {
              segTimes.push(Math.min(time, segEnd))
            }
            // Make sure we include the end time if it's close
            if (
              segTimes.length === 0 ||
              segTimes[segTimes.length - 1] < segEnd - value / 2
            ) {
              segTimes.push(segEnd)
            }
          } else {
            // Extract by total count within the time range
            const interval = rangeDuration / (value + 1)
            for (let i = 1; i <= value; i++) {
              segTimes.push(segStart + i * interval)
            }
          }

          for (const time of segTimes) {
            frameSamples.push({ time, segmentIndex: segIdx })
          }
        }

        // Deduplicate boundary overlaps when segments are adjacent
        const seen = new Set()
        frameSamples = frameSamples.filter(s => {
          const key = Math.round(s.time * 1000)
          if (seen.has(key)) return false
          seen.add(key)
          return true
        })
        frameSamples.sort((a, b) => a.time - b.time)

        // Track per-segment frame count for 0-based per-segment frame index
        const segFrameCounts = new Array(segments.length).fill(0)

        const totalFrames = frameSamples.length

        for (let i = 0; i < frameSamples.length; i++) {
          // Check if extraction should be stopped
          if (shouldStopExtraction) {
            progressFill.textContent = 'Stopped'
            break
          }

          const { time, segmentIndex } = frameSamples[i]

          // Seek to frame time
          videoElement.currentTime = time

          // Wait for seek to complete
          await new Promise(resolve => {
            videoElement.addEventListener('seeked', resolve, { once: true })
          })

          // Check again after seek (in case stop was clicked during seek)
          if (shouldStopExtraction) {
            progressFill.textContent = 'Stopped'
            break
          }

          // Draw frame to canvas
          ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height)

          // Convert to blob
          const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, 'image/jpeg', 0.9)
          })

          const globalIndex = extractedFrames.length + 1
          const segFrameIndex = segFrameCounts[segmentIndex] || 0
          segFrameCounts[segmentIndex] = segFrameIndex + 1
          const frame = {
            id: ++frameIdCounter,
            blob: blob,
            time: time,
            index: globalIndex,
            isManual: false,
            segmentIndex: segmentIndex,
            segmentFrameIndex: segFrameIndex,
          }
          extractedFrames.push(frame)

          // Update progress
          const progressPercent = ((i + 1) / totalFrames) * 100
          progressFill.style.width = progressPercent + '%'
          progressFill.textContent = Math.round(progressPercent) + '%'

          // Show preview
          const previewItem = createPreviewItem(frame, globalIndex)
          previewGrid.appendChild(previewItem)
        }

        // Update frame count
        updateFrameCount()

        progress.classList.remove('active')
        stopBtn.classList.add('hidden')
        previewSection.classList.remove('hidden')
        downloadBtn.disabled = false
        extractBtn.disabled = false
        shouldStopExtraction = false
      }

      downloadBtn.addEventListener('click', async () => {
        if (extractedFrames.length === 0) {
          showError('No frames to download')
          return
        }

        downloadBtn.disabled = true
        downloadBtn.textContent = 'Creating ZIP...'

        try {
          const zip = new JSZip()

          for (let i = 0; i < extractedFrames.length; i++) {
            const frame = extractedFrames[i]
            const totalSecs = frame.time
            const hrs = Math.floor(totalSecs / 3600)
            const mins = Math.floor((totalSecs % 3600) / 60)
            const secs = totalSecs % 60
            const secsInt = Math.floor(secs)
            const ms = Math.round((secs - secsInt) * 1000)
            const timeStr = `${String(hrs).padStart(2, '0')}.${String(mins).padStart(2, '0')}.${String(secsInt).padStart(2, '0')}.${String(ms).padStart(3, '0')}`
            const displayIndex = frame.index
            const segDisplayIndex = frame.segmentIndex !== undefined ? frame.segmentIndex + 1 : undefined
            const hasSegment = segDisplayIndex !== undefined
            const filename = videoFileName
              ? hasSegment
                ? `${videoFileName}_seg${segDisplayIndex}_frame${displayIndex}_${timeStr}.jpg`
                : `${videoFileName}_frame${displayIndex}_${timeStr}.jpg`
              : hasSegment
                ? `frame_seg${segDisplayIndex}_f${displayIndex}_${timeStr}.jpg`
                : `frame_${String(displayIndex).padStart(4, '0')}_${timeStr}.jpg`
            zip.file(filename, frame.blob)
          }

          const zipBlob = await zip.generateAsync({ type: 'blob' })
          const url = URL.createObjectURL(zipBlob)
          const a = document.createElement('a')
          a.href = url
          // Use video filename with frames suffix and frame count
          const frameCount = extractedFrames.length
          const zipFilename = videoFileName
            ? `${videoFileName}_frames_x${frameCount}.zip`
            : `video_frames_x${frameCount}_${Date.now()}.zip`
          a.download = zipFilename
          document.body.appendChild(a)
          a.click()
          document.body.removeChild(a)
          URL.revokeObjectURL(url)

          downloadBtn.textContent = 'Download as ZIP'
          downloadBtn.disabled = false
        } catch (error) {
          showError('Error creating ZIP: ' + error.message)
          downloadBtn.textContent = 'Download as ZIP'
          downloadBtn.disabled = false
        }
      })

      removeAllBtn.addEventListener('click', () => {
        if (extractedFrames.length === 0) return

        // Revoke all object URLs
        previewGrid.querySelectorAll('img').forEach(img => {
          if (img.src) {
            URL.revokeObjectURL(img.src)
          }
        })

        // Clear all frames
        extractedFrames = []
        previewGrid.innerHTML = ''
        updateFrameCount()
        downloadBtn.disabled = true
        previewSection.classList.add('hidden')
      })

      // Handle segment mode toggle (Cutting Points / Explicit)
      document.querySelectorAll('.segment-mode-toggle label').forEach(label => {
        label.addEventListener('click', () => {
          const mode = label.dataset.mode
          if (mode === 'points') {
            switchToPointsMode()
          } else {
            switchToExplicitMode()
          }
        })
      })

      // Add new segment or cut point depending on current mode
      function handleAddSegment() {
        if (segmentMode === 'points') {
          addCutPoint()
        } else {
          addExplicitSegment()
        }
      }

      addSegmentBottomBtn.addEventListener('click', handleAddSegment)

      // Export segments to JSON file
      exportSegmentsBtn.addEventListener('click', exportSegments)

      // Export each segment to a numbered MP4 file.
      exportSegmentVideosBtn.addEventListener('click', exportSegmentVideos)

      // Import segments from JSON file
      importSegmentsBtn.addEventListener('click', () => {
        importFileInput.click()
      })

      importFileInput.addEventListener('change', e => {
        if (e.target.files.length > 0) {
          importSegments(e.target.files[0])
          e.target.value = '' // allow re-importing the same file
        }
      })

      // Click on timeline empty area to seek
      timelineBarContainer.addEventListener('click', e => {
        if (e.target.closest('.timeline-segment')) return
        const rect = timelineBarContainer.getBoundingClientRect()
        const pct = (e.clientX - rect.left) / rect.width
        if (videoElement) {
          const view = getViewRange()
          videoElement.currentTime = view.start + pct * (view.end - view.start)
        }
      })

      // Drag on chart to seek: mousedown seeks+pauses, drag keeps seeking, mouseup resumes if was playing
      let chartWasPlaying = false
      let isDraggingChart = false

      sceneChartCanvas.addEventListener('mousedown', e => {
        isDraggingChart = true
        if (!videoElement) return
        chartWasPlaying = !videoElement.paused
        videoElement.pause()
        const rect = sceneChartCanvas.getBoundingClientRect()
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width))
        const view = getViewRange()
        videoElement.currentTime = view.start + pct * (view.end - view.start)
      })

      document.addEventListener('mousemove', e => {
        if (!isDraggingChart || e.buttons !== 1) return
        const rect = sceneChartCanvas.getBoundingClientRect()
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width))
        if (videoElement) {
          const view = getViewRange()
          videoElement.currentTime = view.start + pct * (view.end - view.start)
        }
      })

      document.addEventListener('mouseup', e => {
        if (!isDraggingChart) return
        isDraggingChart = false
        if (chartWasPlaying && videoElement) {
          videoElement.play()
        }
        chartWasPlaying = false
      })

      // Wheel: zoom on chart+timeline, Shift+Wheel: horizontal pan
      sceneChartCanvas.addEventListener('wheel', e => {
        e.preventDefault()
        if (!videoElement || videoElement.duration <= 0) return
        const rect = sceneChartCanvas.getBoundingClientRect()
        const cursorX = e.clientX - rect.left
        const duration = videoElement.duration

        if (e.shiftKey) {
          // Horizontal pan
          const viewDuration = chartView.end - chartView.start
          const panAmount = (e.deltaY * viewDuration) / rect.width
          chartView.start += panAmount
          chartView.end += panAmount
        } else {
          // Zoom centered on cursor
          const cursorTime = chartView.start + (cursorX / rect.width) * (chartView.end - chartView.start)
          const currentWidth = chartView.end - chartView.start
          const factor = e.deltaY > 0 ? 1.25 : 1 / 1.25
          const newWidth = currentWidth * factor
          const cursorRatio = cursorX / rect.width
          chartView.start = cursorTime - cursorRatio * newWidth
          chartView.end = chartView.start + newWidth
        }

        // Clamp to video duration
        if (chartView.start < 0) {
          chartView.end -= chartView.start
          chartView.start = 0
        }
        if (chartView.end > duration) {
          chartView.start -= (chartView.end - duration)
          chartView.end = duration
        }
        if (chartView.start < 0) chartView.start = 0

        renderTimeline()
      }, { passive: false })

      // Double-click on chart to reset zoom
      sceneChartCanvas.addEventListener('dblclick', e => {
        resetChartView()
        renderTimeline()
      })

      // Analyze scenes button — toggles between analyze and stop
      analyzeScenesBtn.addEventListener('click', () => {
        if (isAnalyzing) {
          shouldStopAnalysis = true
          analyzeScenesBtn.textContent = '⏹ Stopping...'
          analyzeScenesBtn.disabled = true
        } else {
          analyzeSceneChanges()
        }
      })

      // Re-render scene chart on window resize
      window.addEventListener('resize', () => renderSceneChart())

      // Handle Firefox restoring video file across refresh
      if (videoInput.files.length > 0) {
        handleVideoFile(videoInput.files[0])
      }
    </script>
  </body>
</html>
